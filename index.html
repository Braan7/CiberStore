<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiberStore | Mantenimiento</title>
<style>
:root{
  --bg:#070b14;
  --card:rgba(15,22,38,.78);
  --text:#f5f7ff;
  --muted:#98a3ba;
  --accent:#5ee7ff;
  --accent2:#7c5cff;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 20%,rgba(94,231,255,.13),transparent 30%),
    radial-gradient(circle at 80% 75%,rgba(124,92,255,.16),transparent 32%),
    var(--bg);
  overflow:hidden;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);
}
.card{
  width:min(570px,100%);
  position:relative;
  padding:42px 34px 34px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:28px;
  background:var(--card);
  backdrop-filter:blur(20px);
  box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 70px rgba(94,231,255,.06);
}
.logo{
  width:76px;height:76px;margin:0 auto 22px;
  display:grid;place-items:center;
  border-radius:22px;
  font-size:28px;font-weight:900;
  letter-spacing:-2px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#07101c;
  box-shadow:0 0 35px rgba(94,231,255,.2);
}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 13px;border:1px solid var(--line);
  border-radius:999px;color:#c8d0df;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.3px;margin-bottom:16px;
}
.dot{width:7px;height:7px;border-radius:50%;background:#ffc857;box-shadow:0 0 12px #ffc857}
h1{font-size:clamp(28px,6vw,42px);line-height:1.08;margin-bottom:13px}
p{color:var(--muted);line-height:1.65;font-size:15px;max-width:430px;margin:0 auto}
.progress-wrap{margin:31px 0 10px;text-align:left}
.progress-top{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:#cdd4e3;font-weight:700}
.bar{
  height:12px;padding:2px;border-radius:999px;
  background:rgba(255,255,255,.07);overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
}
.fill{
  height:100%;width:72%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 18px rgba(94,231,255,.3);
  position:relative;
  transition:width 1.2s ease;
}
.fill:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
  animation:shine 2.1s infinite;
}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.status{font-size:12px;color:#8490a8;margin-top:12px}
.whatsapp{
  margin-top:27px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 18px;border-radius:15px;text-decoration:none;color:white;font-weight:800;
  background:rgba(37,211,102,.13);border:1px solid rgba(37,211,102,.25);
  transition:.25s ease;
}
.whatsapp:hover{transform:translateY(-2px);background:rgba(37,211,102,.19);box-shadow:0 12px 30px rgba(37,211,102,.1)}
.whatsapp svg{width:20px;height:20px;fill:#25d366}
.footer{margin-top:22px;font-size:11px;color:#667188}
@media(max-width:480px){
  .card{padding:34px 22px 27px;border-radius:23px}
  .logo{width:68px;height:68px}
}
</style>
</head>
<body>
<main class="card">
  <div class="logo">CS</div>
  <div class="badge"><span class="dot"></span> Mantenimiento en curso</div>
  <h1>Volvemos en un momento</h1>
  <p>Estamos realizando mejoras para ofrecerte una experiencia más rápida, estable y moderna en CiberStore.</p>

  <section class="progress-wrap" aria-label="Progreso del mantenimiento">
    <div class="progress-top">
      <span>Progreso</span>
      <span id="percent">72%</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Optimizando servicios…</div>
  </section>

  <a class="whatsapp" href="https://whatsapp.com/channel/0029VbCXQVjJENyAgAoJLJ3g" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24"><path d="M20.52 3.48A11.8 11.8 0 0 0 12.08 0C5.54 0 .22 5.32.22 11.86c0 2.09.55 4.13 1.59 5.93L.12 24l6.35-1.66a11.83 11.83 0 0 0 5.61 1.42h.01c6.54 0 11.86-5.32 11.86-11.86a11.8 11.8 0 0 0-3.43-8.42ZM12.09 21.72h-.01a9.83 9.83 0 0 1-5.01-1.37l-.36-.21-3.77.99 1.01-3.68-.23-.38a9.84 9.84 0 1 1 8.37 4.65Zm5.4-7.38c-.3-.15-1.78-.88-2.05-.98-.28-.1-.48-.15-.69.15-.2.3-.79.98-.97 1.18-.18.2-.36.23-.66.08-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.14.3-.36.45-.54.15-.18.2-.3.3-.5.1-.2.05-.38-.03-.53-.08-.15-.69-1.65-.95-2.26-.25-.59-.5-.51-.69-.52h-.59c-.2 0-.53.08-.81.38-.28.3-1.06 1.04-1.06 2.54s1.09 2.95 1.24 3.15c.15.2 2.15 3.28 5.21 4.6.73.31 1.3.5 1.75.64.74.24 1.41.2 1.94.12.59-.09 1.78-.73 2.03-1.43.25-.7.25-1.3.18-1.43-.08-.13-.28-.2-.58-.35Z"/></svg>
    Seguir novedades en WhatsApp
  </a>

  <div class="footer">CiberStore • Sistema temporalmente fuera de servicio</div>
</main>

<script>
  // Cambia este valor para ajustar el porcentaje mostrado.
  const progress = 72;
  const fill = document.getElementById('fill');
  const percent = document.getElementById('percent');
  const status = document.getElementById('status');
  const messages = [
    'Optimizando servicios…',
    'Aplicando mejoras…',
    'Verificando sistemas…',
    'Casi terminamos…'
  ];
  fill.style.width = progress + '%';
  percent.textContent = progress + '%';
  let i = 0;
  setInterval(() => {
    i = (i + 1) % messages.length;
    status.textContent = messages[i];
  }, 2800);
</script>
</body>
</html>
